name: Validate Git & GitHub course
on: [push, pull_request]

permissions:
  contents: read

jobs:
  course:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect Git version
        run: git --version
      - name: Run all course and Git practice tests
        run: python -m unittest discover -s tests -v
      - name: Inspect graded task catalog
        run: python tools/practice.py list
